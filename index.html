<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family TikTok • Live & Berlian</title>
<style>
body{margin:0;font-family:Arial;background:#061426;color:#f4faff}header{padding:16px;background:#0a2340;position:sticky;top:0}main{max-width:700px;margin:auto;padding:16px 12px 80px}.card{background:#0a2039;border:1px solid #1d5687;border-radius:17px;padding:16px;margin-bottom:13px}.page{display:none}.page.active{display:block}button{padding:12px;border:0;border-radius:10px;background:#0875ff;color:white;font-weight:bold;margin:2px}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;margin:5px 0 12px;border-radius:9px;border:1px solid #28608e;background:#051321;color:white}.stat{font-size:29px;color:#28d9ff;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.row{padding:12px;margin:7px 0;background:#07192c;border-radius:12px;border:1px solid #173e62}.muted{color:#9cb5cd}nav{position:fixed;bottom:0;left:0;right:0;background:#061426;border-top:1px solid #1d5687;display:flex;justify-content:center}nav button{background:transparent;color:#b4cce2}
</style>
<header><b>♛ FAMILY TIKTOK</b><br><small>🎥 LIVE • 💎 BERLIAN • 🏆 RANKING</small></header>
<main>
<section id="dash" class="page active"><div class="grid"><div class="card"><div class="stat" id="totalD">0</div><div class="muted">💎 Total Berlian</div></div><div class="card"><div class="stat" id="totalL">0</div><div class="muted">🎥 Total Live</div></div></div><div class="card"><h3>🏆 Ranking Berlian</h3><div id="rank"></div></div></section>
<section id="live" class="page"><div class="card"><h2>🎥 Catat Hasil Live</h2><label>Anggota</label><select id="member"></select><label>Durasi Live (menit)</label><input id="duration" type="number" value="60" min="0"><label>💎 Berlian Diperoleh</label><input id="diamonds" type="number" value="0" min="0"><label>Catatan</label><textarea id="notes" placeholder="Contoh: Live malam, event Family"></textarea><button onclick="recordLive()">SIMPAN HASIL LIVE</button><div id="msg"></div></div></section>
<section id="history" class="page"><div class="card"><h2>📜 Riwayat Live</h2><div id="historyList"></div></div></section>
</main>
<nav><button onclick="go('dash')">💎<br>Dashboard</button><button onclick="go('live')">🎥<br>Catat Live</button><button onclick="go('history')">📜<br>Riwayat</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
let sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY), fam=null, M=[];
function go(x){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(x).classList.add('active');if(x==='dash')load();if(x==='history')history()}
async function load(){let{data:{user}}=await sb.auth.getUser();if(!user){rank.innerHTML='Silakan login melalui aplikasi utama.';return}let{data:f}=await sb.from('families').select('*').eq('chief_id',user.id).maybeSingle();fam=f;if(!f)return;let{data}=await sb.from('members').select('*').eq('family_id',f.id);M=data||[];member.innerHTML=M.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');totalD.textContent=M.reduce((a,x)=>a+(+x.diamonds||0),0).toLocaleString('id-ID');rank.innerHTML=[...M].sort((a,b)=>(b.diamonds||0)-(a.diamonds||0)).map((x,i)=>`<div class="row">#${i+1} <b>${x.name}</b><br><span class="muted">${x.role}</span><span style="float:right">💎 ${(x.diamonds||0).toLocaleString('id-ID')}</span></div>`).join('');let{count}=await sb.from('live_history').select('*',{count:'exact',head:true}).eq('family_id',f.id);totalL.textContent=count||0}
async function recordLive(){let d=+diamonds.value||0,du=+duration.value||0;let{error}=await sb.rpc('record_live',{p_member_id:member.value,p_duration_minutes:du,p_diamonds:d,p_notes:notes.value||null,p_source:'manual'});msg.innerHTML=error?'❌ '+error.message:'✅ Hasil Live tersimpan. Berlian dan ranking diperbarui.';if(!error){diamonds.value=0;notes.value='';load()}}
async function history(){if(!fam)await load();if(!fam)return;let{data}=await sb.from('live_history').select('*,members(name)').eq('family_id',fam.id).order('live_date',{ascending:false});historyList.innerHTML=(data||[]).map(x=>`<div class="row"><b>${x.members?.name||'Anggota'}</b><br>🎥 ${x.duration_minutes} menit • 💎 ${x.diamonds.toLocaleString('id-ID')}<br><span class="muted">${new Date(x.live_date).toLocaleString('id-ID')} • ${x.source}</span></div>`).join('')||'<p class="muted">Belum ada riwayat Live.</p>'}
load();
</script></html>
